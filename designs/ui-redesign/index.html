<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenToggle · 黑白 Liquid Glass 重设计</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root {
  /* ── OpenToggle 黑白 liquid glass 令牌（源自 app 图标） ─────────────── */
  --ot-bg: #0a0b0d;               /* 深空底 */
  --ot-glass: rgba(255,255,255,.035);
  --ot-glass-2: rgba(255,255,255,.07);
  --ot-line: rgba(255,255,255,.13);      /* 发丝描线 */
  --ot-line-strong: rgba(255,255,255,.34);
  --ot-txt: rgba(255,255,255,.92);
  --ot-txt-2: rgba(255,255,255,.55);
  --ot-txt-3: rgba(255,255,255,.30);
  --ot-white: #fff;
  --ot-sans: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
  --ot-mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
}

/* ── 玻璃面板基底：icon 同款质感 —— 烟灰玻璃 + 发丝高光边 + 顶部斜射 sheen ── */
.ot-surface {
  position: relative;
  background:
    radial-gradient(120% 90% at 20% -10%, rgba(255,255,255,.075), transparent 45%),
    radial-gradient(140% 120% at 85% 110%, rgba(255,255,255,.05), transparent 50%),
    linear-gradient(160deg, #16181c 0%, #0e1013 55%, #101216 100%);
  border: 1px solid var(--ot-line);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 0 -1px 0 rgba(255,255,255,.04),
    0 0 0 .5px rgba(255,255,255,.06),
    0 18px 50px rgba(0,0,0,.55),
    0 0 34px rgba(255,255,255,.045);
  color: var(--ot-txt);
  font-family: var(--ot-sans);
}
.ot-surface::before { /* 斜向玻璃 sheen */
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(115deg, transparent 32%, rgba(255,255,255,.045) 42%, transparent 55%);
}

/* ── 开关拨杆：胶囊描线 + 实心发光旋钮（图标语言的核心） ───────────── */
.ot-toggle { position: relative; width: 40px; height: 22px; border-radius: 11px;
  border: 1px solid var(--ot-line-strong); cursor: pointer; flex: 0 0 auto;
  transition: border-color .18s, box-shadow .18s; background: rgba(255,255,255,.02); }
.ot-toggle .knob { position: absolute; top: 2px; width: 16px; height: 16px; border-radius: 50%;
  transition: left .18s cubic-bezier(.3,.9,.4,1.2), background .18s, box-shadow .18s, border-color .18s; }
.ot-toggle.on { border-color: rgba(255,255,255,.65);
  box-shadow: 0 0 10px rgba(255,255,255,.14), inset 0 0 6px rgba(255,255,255,.07); }
.ot-toggle.on .knob { left: 20px; background: var(--ot-white); border: none;
  box-shadow: 0 0 10px rgba(255,255,255,.85), 0 0 26px rgba(255,255,255,.4); }
.ot-toggle.off .knob { left: 2px; background: transparent; border: 1px solid var(--ot-line-strong); }
.ot-toggle:hover { border-color: rgba(255,255,255,.8); }

/* 微型状态记号（行首）：on 发光点 / off 空心环 / error ✗ / unknown ? */
.ot-st { width: 14px; text-align: center; flex: 0 0 auto; font-family: var(--ot-mono); font-size: 10px; }
.ot-st .dot-on { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: #fff; box-shadow: 0 0 8px rgba(255,255,255,.9); }
.ot-st .dot-off { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  border: 1px solid var(--ot-txt-3); }

/* 行内小图标（描线 SVG） */
.ot-glyph { width: 17px; height: 17px; flex: 0 0 auto; stroke: currentColor; fill: none;
  stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }

/* 参数控件族 */
.ot-chip { display: inline-flex; align-items: center; justify-content: center;
  padding: 3px 9px; border-radius: 7px; border: 1px solid var(--ot-line);
  font-size: 11px; color: var(--ot-txt-2); cursor: pointer; background: rgba(255,255,255,.02);
  transition: all .15s; }
.ot-chip:hover { border-color: var(--ot-line-strong); color: var(--ot-txt); }
.ot-chip.sel { background: rgba(255,255,255,.92); color: #0c0d10; border-color: transparent;
  font-weight: 600; box-shadow: 0 0 12px rgba(255,255,255,.28); }
.ot-field { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px;
  border-radius: 7px; border: 1px solid var(--ot-line); font-size: 11px; color: var(--ot-txt);
  background: rgba(0,0,0,.28); font-family: var(--ot-mono); }

/* 倒计时 mono 数字 */
.ot-count { font-family: var(--ot-mono); font-variant-numeric: tabular-nums;
  font-size: 11px; color: var(--ot-txt-2); letter-spacing: .04em; }

/* hairline 分隔 */
.ot-hr { height: 1px; background: linear-gradient(90deg, transparent, var(--ot-line) 18%, var(--ot-line) 82%, transparent); border: 0; margin: 0; }

/* B 方案磁贴 */
.ot-tile { border-radius: 16px; border: 1px solid var(--ot-line); padding: 12px;
  background: linear-gradient(150deg, rgba(255,255,255,.055), rgba(255,255,255,.015) 60%);
  position: relative; cursor: pointer; transition: border-color .18s, box-shadow .18s; }
.ot-tile.live { border-color: rgba(255,255,255,.5);
  box-shadow: 0 0 18px rgba(255,255,255,.10), inset 0 1px 0 rgba(255,255,255,.18); }
.ot-tile:hover { border-color: rgba(255,255,255,.6); }

/* C 方案终端 */
.ot-term { font-family: var(--ot-mono); font-size: 11.5px; line-height: 1.9; letter-spacing: .01em; }
.ot-term .dim { color: var(--ot-txt-3); }
.ot-term .mid { color: var(--ot-txt-2); }
.ot-term .hot { color: #fff; text-shadow: 0 0 9px rgba(255,255,255,.55); }
.ot-term .blk-on { display: inline-block; width: 8px; height: 12px; background: #fff;
  box-shadow: 0 0 8px rgba(255,255,255,.8); vertical-align: -1px; }
.ot-term .blk-off { display: inline-block; width: 8px; height: 12px;
  border: 1px solid var(--ot-txt-3); vertical-align: -1px; box-sizing: border-box; }
@keyframes ot-blink { 0%,49% {opacity:1} 50%,100% {opacity:0} }
.ot-cursor { display: inline-block; width: 8px; height: 13px; background: #fff;
  box-shadow: 0 0 8px rgba(255,255,255,.7); vertical-align: -2px; animation: ot-blink 1.1s step-end infinite; }

/* 通用小按钮（footer） */
.ot-ghost { display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; border-radius: 8px;
  color: var(--ot-txt-2); font-size: 11.5px; cursor: pointer; border: 1px solid transparent; transition: all .15s; }
.ot-ghost:hover { color: var(--ot-txt); border-color: var(--ot-line); background: rgba(255,255,255,.03); }

/* 画布卡片透明化：深色玻璃面板自带阴影，白底卡片会露出难看的空尾 */
.dc-card { background: transparent !important; box-shadow: none !important; }

/* token swatch（intro 板） */
.ot-sw { display: flex; align-items: center; gap: 10px; font: 11px var(--ot-mono); color: var(--ot-txt-2); }
.ot-sw i { width: 34px; height: 22px; border-radius: 6px; border: 1px solid var(--ot-line); flex: 0 0 auto; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="option-a.jsx"></script>
<script type="text/babel" src="option-b.jsx"></script>
<script type="text/babel" src="option-c.jsx"></script>
<script type="text/babel" src="option-a-full.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
